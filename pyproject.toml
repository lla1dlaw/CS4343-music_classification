[project]
name = "final-project"
version = "0.1.0"
description = "Final Project for CS-4343, WPI, Fall 26'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "polars>=1.44.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
gpu = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[tool.uv]
# Prevent uv from trying to install both CPU and GPU versions at once
conflicts = [
  [ { extra = "cpu" }, { extra = "gpu" } ]
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "gpu" },
]

# Explicitly define the PyTorch indexes
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# specify build system so for to allow src/ modules 
# to be imported in experiment scripts without path
# hacking
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datasets",
    "src/evaluate",
    "src/modules",
    "src/train",
]
